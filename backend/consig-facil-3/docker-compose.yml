services:
  # O NOSSO BANCO DE DADOS (Roda sempre por padrão)
  postgres:
    image: postgres:17-alpine
    container_name: consig_postgres
    ports:
      # O lado esquerdo lê a variável, o lado direito (5432) é a porta interna do contêiner
      - "${DB_LOCAL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - consig_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # O NOSSO BACKEND (Só roda se chamarmos o profile "full" via terminal)
  backend:
    build:
      context: .
    container_name: consig_backend
    ports:
      - "8080:8080"
    environment:
      # Quando roda via Docker, o host do banco é o nome do serviço ("postgres")
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    profiles:
      - "full"

volumes:
  # Volume nomeado para os dados do Postgres não sumirem quando desligar o contêiner
  consig_pg_data:
    name: consig_pg_data