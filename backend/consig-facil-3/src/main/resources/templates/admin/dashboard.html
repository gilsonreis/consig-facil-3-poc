<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/master :: layout(~{::main})}">
<body>
    <main>
        <div class="container-fluid py-4" id="main-content">
            <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
                <div>
                    <h3 class="mb-1 fw-bold text-dark">Painel Administrativo</h3>
                    <p class="text-muted mb-0">Bem-vindo de volta! Gestão centralizada de contratos e servidores.</p>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card metric-card metric-card-bg-primary">
                        <h5 class="card-title">Contratos Pendentes</h5>
                        <p class="card-value">15</p>
                        <i class="bi bi-clock-history card-icon"></i>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card metric-card metric-card-bg-success">
                        <h5 class="card-title">Volume Aprovado</h5>
                        <p class="card-value">R$ 1.250.000,00</p>
                        <i class="bi bi-currency-dollar card-icon"></i>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card metric-card metric-card-bg-info">
                        <h5 class="card-title">Servidores Ativos</h5>
                        <p class="card-value">250</p>
                        <i class="bi bi-people-fill card-icon"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
