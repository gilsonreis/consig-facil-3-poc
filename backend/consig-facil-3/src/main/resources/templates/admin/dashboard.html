<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/master :: layout(~{::main})}">
<body>
    <main>
        <div class="container-fluid" id="main-content">
            <h1 class="mt-4">Bem-vindo ao ConsigFácil Admin!</h1>
            <p class="text-muted">Gestão centralizada de contratos e servidores.</p>

            <div class="row mt-4">
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card text-white bg-primary position-relative overflow-hidden">
                        <div class="card-body">
                            <h5 class="card-title">Contratos Pendentes</h5>
                            <p class="card-text fs-3">15</p>
                            <i class="bi bi-clock-history card-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card text-white bg-success position-relative overflow-hidden">
                        <div class="card-body">
                            <h5 class="card-title">Volume Aprovado</h5>
                            <p class="card-text fs-3">R$ 1.250.000,00</p>
                            <i class="bi bi-currency-dollar card-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card text-white bg-info position-relative overflow-hidden">
                        <div class="card-body">
                            <h5 class="card-title">Servidores Ativos</h5>
                            <p class="card-text fs-3">250</p>
                            <i class="bi bi-people-fill card-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
