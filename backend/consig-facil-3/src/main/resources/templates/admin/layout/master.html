<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsigFácil Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        #wrapper {
            display: flex;
        }
        #sidebar-wrapper {
            margin-left: -15rem;
            transition: margin .25s ease-out;
        }
        #sidebar-wrapper .list-group {
            width: 15rem;
        }
        #page-content-wrapper {
            min-width: 100vw;
        }
        #wrapper.toggled #sidebar-wrapper {
            margin-left: 0;
        }
        @media (min-width: 768px) {
            #sidebar-wrapper {
                margin-left: 0;
            }
            #page-content-wrapper {
                min-width: 0;
                width: 100%;
            }
            #wrapper.toggled #sidebar-wrapper {
                margin-left: -15rem;
            }
        }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper" class="d-flex flex-column">
            <div class="sidebar-heading text-center">
                <img th:src="@{/images/logo_consigfacil.svg}" alt="Logo" style="width: 120px; filter: brightness(0) invert(1);">
                <div class="mt-2" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; color: #64748b;">ADMIN PANEL</div>
            </div>
            <div class="list-group list-group-flush flex-grow-1">
                <a th:href="@{/admin/dashboard}" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2 me-3"></i>Dashboard
                </a>
                <a th:href="@{/admin/contratos}" class="list-group-item list-group-item-action">
                    <i class="bi bi-file-earmark-text me-3"></i>Contratos
                </a>
                <a th:href="@{/admin/servidores}" class="list-group-item list-group-item-action">
                    <i class="bi bi-people me-3"></i>Servidores
                </a>
                <a th:href="@{/admin/auth/logout}" class="list-group-item list-group-item-action mt-auto mb-3">
                    <i class="bi bi-box-arrow-left me-3"></i>Sair
                </a>
            </div>
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <button id="sidebarToggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <i class="bi bi-person-circle me-1"></i> Admin User
                                </a>
                                <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                    <a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Configurações</a>
                                    <div class="dropdown-divider"></div>
                                    <a class="dropdown-item" th:href="@{/admin/auth/logout}"><i class="bi bi-box-arrow-left me-2"></i>Sair</a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Dynamic Content -->
            <div th:replace="${conteudo}">
                <!-- Content will be injected here -->
            </div>
        </div>
        <!-- /#page-content-wrapper -->
    </div>
    <!-- /#wrapper -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('wrapper').classList.toggle('toggled');
        });

        // Dynamic active state for Sidebar
        document.addEventListener("DOMContentLoaded", function() {
            const currentPath = window.location.pathname;
            const menuLinks = document.querySelectorAll("#sidebar-wrapper .list-group-item");
            menuLinks.forEach(link => {
                const href = link.getAttribute("href");
                if (href && href !== '#' && (currentPath === href || (href !== "/admin/dashboard" && currentPath.startsWith(href)))) {
                    link.classList.add("active");
                }
            });
        });
    </script>
</body>
</html>
