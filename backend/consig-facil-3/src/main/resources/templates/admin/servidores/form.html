<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/master :: layout(~{::main})}">
<body>
    <main>
        <div class="container-fluid px-4">
            <nav aria-label="breadcrumb" class="mt-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/servidores}">Servidores</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Novo Servidor</li>
                </ol>
            </nav>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-light py-3">
                    <h5 class="mb-0 text-primary fw-bold">Cadastro de Novo Servidor</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/servidores/novo}" method="POST" th:object="${cadastrarServidorInput}">
                        
                        <!-- Mensagens de Erro/Sucesso -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${errorMessage}">Erro ao salvar</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${successMessage}">Sucesso!</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div class="row g-3">
                            <!-- CPF (Campo de busca HTMX) -->
                            <div class="col-md-4">
                                <label for="cpf" class="form-label fw-bold">CPF</label>
                                <input type="text" 
                                       id="cpf" 
                                       name="cpf" 
                                       class="form-control" 
                                       placeholder="Digite o CPF para buscar"
                                       required
                                       th:value="*{cpf}"
                                       hx-get="/admin/usuarios/busca-cpf"
                                       hx-trigger="keyup changed delay:500ms, blur"
                                       hx-target="#dadosPessoaisContainer">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                            </div>

                            <!-- Container para Dados Pessoais (Carregado via HTMX) -->
                            <div id="dadosPessoaisContainer" class="col-12">
                                <!-- Fragmento será injetado aqui -->
                                <div th:replace="~{admin/servidores/fragmentos/form-dados-pessoais :: conteudo}"></div>
                            </div>

                            <hr class="my-4">
                            <h6 class="text-secondary fw-bold mb-3">Dados do Vínculo</h6>

                            <div class="col-md-6">
                                <label for="matricula" class="form-label fw-bold">Matrícula</label>
                                <input type="text" id="matricula" name="matricula" class="form-control" th:value="*{matricula}" required>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="margemConsignavel" class="form-label fw-bold">Margem Consignável (R$)</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" step="0.01" id="margemConsignavel" name="margemConsignavel" class="form-control" th:value="*{margemConsignavel}" required>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('margemConsignavel')}" th:errors="*{margemConsignavel}"></div>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <a th:href="@{/admin/servidores}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-2"></i>Salvar Servidor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
