<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConsigFácil Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 1rem !important;
        }
    </style>
</head>
<body class="login-bg">
    <div class="container login-container">
        <div class="card login-card glass-panel border-0 p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <img th:src="@{/images/logo_consigfacil.svg}" alt="ConsigFácil" style="width: 160px; filter: brightness(0) invert(1);">
                </div>
                <h4 class="text-center mb-4 fw-bold text-white">Login Administrativo</h4>

                <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    Usuário ou senha inválidos.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
                    Você saiu com sucesso.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/admin/auth/login}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-white fw-500">CPF/E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-0" id="username" name="username" placeholder="Digite seu CPF ou E-mail" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-white fw-500">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-0" id="password" name="password" placeholder="Digite sua senha" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2.5 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
