@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300">
    
    <!-- Caixa do Modal -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 border border-slate-100 mx-4 transform transition-all duration-300 scale-100 ease-out animate-in zoom-in-95 duration-200">
      
      <!-- Icon Container -->
      <div class="flex justify-center">
        @if (type === 'confirmacao') {
          <div class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center border border-amber-100/50 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="w-8 h-8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.008v.008H12v-.008z" />
            </svg>
          </div>
        } @else {
          <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center border border-emerald-100/50 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="w-8 h-8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12z" />
            </svg>
          </div>
        }
      </div>

      <!-- Título e Mensagem -->
      <div class="text-center mt-5 space-y-2">
        <h3 class="text-2xl font-extrabold text-slate-800 tracking-tight">{{ title }}</h3>
        <p class="text-slate-500 leading-relaxed text-sm">{{ message }}</p>
      </div>

      <!-- Rodapé de Ações -->
      @if (type === 'confirmacao') {
        <div class="flex gap-3 mt-8">
          <button 
            type="button" 
            (click)="cancel()" 
            class="flex-1 py-3.5 px-4 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all duration-200 text-sm border border-slate-200"
          >
            Cancelar
          </button>
          <button 
            type="button" 
            (click)="confirm()" 
            class="flex-1 py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl transition-all duration-200 text-sm shadow-lg shadow-blue-100 hover:shadow-blue-200 hover:-translate-y-0.5"
          >
            Confirmar
          </button>
        </div>
      } @else {
        <div class="mt-8">
          <button 
            type="button" 
            (click)="confirm()" 
            class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl transition-all duration-200 text-sm shadow-lg shadow-emerald-100 hover:shadow-emerald-200 hover:-translate-y-0.5"
          >
            Concluir
          </button>
        </div>
      }

    </div>
  </div>
}
