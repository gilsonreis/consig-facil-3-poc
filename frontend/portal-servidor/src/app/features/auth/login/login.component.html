<div class="min-h-screen bg-slate-50 grid place-items-center relative overflow-hidden px-4">
  <!-- Elementos de design de fundo (Blobs de Gradiente) -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000 pointer-events-none"></div>

  <!-- Card Principal -->
  <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8 w-full max-w-md relative z-10 transition-all duration-300 hover:shadow-2xl">
    
    <!-- Cabeçalho / Logo -->
    <div class="text-center mb-8">
      <div class="h-12 w-48 bg-blue-600 mx-auto" style="-webkit-mask: url('/images/logo_consigfacil.svg') no-repeat center / contain; mask: url('/images/logo_consigfacil.svg') no-repeat center / contain;"></div>
      <p class="text-sm text-slate-500 mt-2">Portal do Servidor</p>
    </div>

    <!-- Mensagem de Erro Geral -->
    @if (errorMessage) {
      <div class="mb-5 p-4 bg-red-50 border border-red-200 rounded-xl flex items-start gap-3 text-red-700 animate-fadeIn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mt-0.5 shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        <span class="text-sm font-medium">{{ errorMessage }}</span>
      </div>
    }

    <!-- Formulário de Login -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Input de CPF -->
      <div>
        <label for="cpf" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">CPF</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
          </span>
          <input
            id="cpf"
            type="text"
            formControlName="cpf"
            placeholder="000.000.000-00"
            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
            [class.border-red-300]="isFieldInvalid('cpf')"
            [class.focus:ring-red-500]="isFieldInvalid('cpf')"
          />
        </div>
        @if (isFieldInvalid('cpf')) {
          <p class="text-xs text-red-500 mt-1.5 font-medium animate-fadeIn">Por favor, insira um CPF válido.</p>
        }
      </div>

      <!-- Input de Senha -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label for="senha" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Senha</label>
          <a href="#" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition-colors">Esqueceu a senha?</a>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
          </span>
          <input
            id="senha"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="senha"
            placeholder="••••••••"
            class="w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
            [class.border-red-300]="isFieldInvalid('senha')"
            [class.focus:ring-red-500]="isFieldInvalid('senha')"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none"
          >
            @if (showPassword) {
              <!-- Ícone de Olho Aberto -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            } @else {
              <!-- Ícone de Olho Fechado -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            }
          </button>
        </div>
        @if (isFieldInvalid('senha')) {
          <p class="text-xs text-red-500 mt-1.5 font-medium animate-fadeIn">A senha é obrigatória (mínimo de 4 caracteres).</p>
        }
      </div>

      <!-- Botão Entrar -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/10 hover:shadow-blue-500/20 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-70 disabled:cursor-not-allowed"
      >
        @if (loading) {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Entrando...
        } @else {
          Entrar
        }
      </button>
    </form>

    <!-- Divisor -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-100"></div>
      </div>
      <div class="relative flex justify-center text-xs uppercase">
        <span class="bg-white px-3 text-slate-400 font-medium">Novo por aqui?</span>
      </div>
    </div>

    <!-- Primeiro Acesso / Criar Senha -->
    <div class="text-center">
      <a
        href="#"
        class="inline-block py-2.5 px-4 w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold rounded-xl text-sm border border-blue-100/50 hover:border-blue-200/50 transition-all duration-200"
      >
        Primeiro Acesso / Criar Senha
      </a>
    </div>

  </div>
</div>
