info:
  name: Criar Servidor
  type: http
  seq: 1

http:
  method: post
  url: "{{base_url}}/api/v1/servidores"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
       "usuarioId": 2,
       "matricula": "MATRICULA123",
       "margemConsignavel": 1500.00
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
